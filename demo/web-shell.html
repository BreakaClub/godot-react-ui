<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <link rel="icon" href="data:,">
    <title>$GODOT_PROJECT_NAME</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
      /* The engine sizes the canvas from window.innerWidth, in pixels. A phone turned from landscape back to portrait still has the landscape canvas
         for a few frames, and that canvas is wider than the layout viewport and counts toward the document's size: a mobile browser zooms out to fit
         it, which makes innerWidth the wider size, and the canvas never shrinks (docs/tracks/rotation.md). The stage, fixed and clipping, keeps the
         canvas out of the document's size, and `minimum-scale=1` above stops the browser zooming out. */
      #stage { position: fixed; inset: 0; overflow: hidden; }
      #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #status { position: fixed; inset: 0; display: grid; place-content: center; padding: 32px; color: #334155; background: #f8fafc; font: 16px/1.5 system-ui, sans-serif; white-space: pre-wrap; }
      #status[hidden] { display: none; }
    </style>
    $GODOT_HEAD_INCLUDE
  </head>
  <body>
    <div id="stage">
      <canvas id="canvas" tabindex="0" aria-label="Godot React UI demonstration"></canvas>
    </div>
    <div id="status" role="status">Loading the native UI playground…</div>
    <script src="$GODOT_URL"></script>
    <script>
      const config = $GODOT_CONFIG;
      const engine = new Engine(config);
      const canvas = document.getElementById('canvas');
      const status = document.getElementById('status');
      // Normalize Shift+scroll when the browser or device leaves the delta on deltaY (for example macOS trackpads or when
      // the canvas did not hold DOM focus when Shift was pressed, so DisplayServerWeb's Input::is_key_pressed(Key::SHIFT)
      // is false and _mouse_wheel_callback would otherwise check p_delta_y before p_delta_x).
      canvas.addEventListener('wheel', event => {
        if (event.shiftKey && event.deltaY !== 0) {
          event.stopImmediatePropagation();
          event.preventDefault();
          canvas.dispatchEvent(new WheelEvent('wheel', {
            bubbles: true,
            cancelable: true,
            clientX: event.clientX,
            clientY: event.clientY,
            screenX: event.screenX,
            screenY: event.screenY,
            deltaMode: event.deltaMode,
            deltaX: Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY,
            deltaY: 0,
            deltaZ: event.deltaZ,
            ctrlKey: event.ctrlKey,
            shiftKey: event.shiftKey,
            altKey: event.altKey,
            metaKey: event.metaKey,
            buttons: event.buttons,
          }));
        }
      }, true);
      // Keep Ctrl+C / Cmd+C and the browser's copy command working for selectable text even when the canvas lost DOM focus
      // or the browser requires clipboard writes inside the synchronous DOM keydown/copy gesture.
      window.addEventListener('keydown', event => {
        if (document.activeElement === document.body || document.activeElement === document.documentElement) {
          canvas.focus();
        }
        if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.shiftKey && event.key.toLowerCase() === 'c') {
          const selected = window.__godotReactSelectedText;
          if (typeof selected === 'string' && selected.length > 0) {
            navigator.clipboard?.writeText?.(selected)?.catch(() => {});
          }
        }
      }, true);
      window.addEventListener('copy', event => {
        const selected = window.__godotReactSelectedText;
        if (typeof selected === 'string' && selected.length > 0 && event.clipboardData) {
          event.clipboardData.setData('text/plain', selected);
          event.preventDefault();
        }
      });
      const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
      const args = ['--audio-driver', 'Dummy'];
      const params = new URLSearchParams(location.search);
      // The lab the address names, or null: `?lab=glass`, or in the hash `#lab=glass`, `#/labs/glass` or `#glass`. A hash of other
      // parameters (`#foo=bar`) names none.
      function labOfAddress() {
        const fromQuery = new URLSearchParams(location.search).get('lab');
        if (fromQuery) return fromQuery;
        const hash = location.hash.replace(/^#\/?/, '');
        if (hash.includes('=')) return new URLSearchParams(hash).get('lab') || null;
        if (hash.startsWith('labs/')) return hash.slice('labs/'.length) || null;
        return hash !== '' && !hash.includes('/') && !hash.includes('?') ? hash : null;
      }
      const requestedLab = labOfAddress();
      // Arguments for the demo's scripts follow `--`. `?scene=res://world.tscn` starts that scene instead of
      // the project's main scene through the SceneLauncher autoload: Breaka's Web engine has no
      // command-line path overrides, so the scene cannot be given to the engine itself (docs/WORLD_SPACE.md).
      // `?lab=glass` opens the lab navigator on that lab, `?demo=navigator` opens it on its first lab and `?demo=app` opens the
      // single-page playground. This page, bare, opens the playground, which is what the Web verifiers load; `pnpm demo:web`
      // sends the bare address to the navigator (demo/src/launch.ts).
      const userArgs = [];
      if (params.get('verify') === '1') userArgs.push('--verify');
      if (params.get('scene') !== null) userArgs.push('--scene', params.get('scene'));
      if (requestedLab !== null) userArgs.push(`--lab=${requestedLab}`);
      if (params.get('demo') !== null) userArgs.push(`--demo=${params.get('demo')}`);
      else if (requestedLab === null) userArgs.push('--demo=app');
      if (userArgs.length > 0) args.push('--', ...userArgs);

      // Back, forward and an edited hash open the lab the address names in the running page (before the demo has started, the
      // address it starts from is the one above).
      function syncFromBrowserUrl(event) {
        const lab = labOfAddress() ?? event?.state?.lab;
        if (lab && typeof window.godotReactDemo?.navigateLab === 'function') {
          window.godotReactDemo.navigateLab(lab);
        }
      }
      window.addEventListener('popstate', syncFromBrowserUrl);
      window.addEventListener('hashchange', syncFromBrowserUrl);
      if (missing.length) {
        status.textContent = `This browser is missing required features:\n${missing.join('\n')}`;
      } else {
        engine.startGame({
          args,
          // The loader counts the bytes it receives after the browser has decoded them (a compressed transfer arrives as the file's own
          // bytes) against the sizes the export wrote in `fileSizes`, which are the files' own sizes: the percentage is right whatever the
          // transfer encoding. It follows only the pack and the engine module; the side modules load beside them through Emscripten and
          // are not counted, so the percentage can reach 100% while they are still arriving: the page then says what is happening instead
          // of sitting on a number.
          onProgress(current, total) {
            if (total <= 0) return;
            status.textContent = current >= total
              ? 'Starting the native UI playground…'
              : `Loading the native UI playground… ${Math.round(current / total * 100)}%`;
          },
        }).then(() => { status.hidden = true; }).catch(error => {
          console.error('GODOT_REACT_START_FAILED', error);
          status.textContent = `Unable to start the demo.\n${String(error)}`;
        });
      }
    </script>
  </body>
</html>
