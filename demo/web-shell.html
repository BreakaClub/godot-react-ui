<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>$GODOT_PROJECT_NAME</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
      #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #status { position: fixed; inset: 0; display: grid; place-content: center; padding: 32px; color: #334155; background: #f8fafc; font: 16px/1.5 system-ui, sans-serif; white-space: pre-wrap; }
      #status[hidden] { display: none; }
    </style>
    $GODOT_HEAD_INCLUDE
  </head>
  <body>
    <canvas id="canvas" tabindex="0" aria-label="Godot React UI demonstration"></canvas>
    <div id="status" role="status">Loading the native UI playground…</div>
    <script src="$GODOT_URL"></script>
    <script>
      const config = $GODOT_CONFIG;
      const engine = new Engine(config);
      const status = document.getElementById('status');
      const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
      const args = ['--audio-driver', 'Dummy'];
      if (new URLSearchParams(location.search).get('verify') === '1') args.push('--', '--verify');
      if (missing.length) {
        status.textContent = `This browser is missing required features:\n${missing.join('\n')}`;
      } else {
        engine.startGame({
          args,
          onProgress(current, total) {
            if (total > 0) status.textContent = `Loading the native UI playground… ${Math.round(current / total * 100)}%`;
          },
        }).then(() => { status.hidden = true; }).catch(error => {
          console.error('GODOT_REACT_START_FAILED', error);
          status.textContent = `Unable to start the demo.\n${String(error)}`;
        });
      }
    </script>
  </body>
</html>
