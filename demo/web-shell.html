<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
    <link rel="icon" href="data:,">
    <title>$GODOT_PROJECT_NAME</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
      /* The engine sizes the canvas from window.innerWidth, in pixels. A phone turned from landscape back to portrait still has the landscape canvas
         for a few frames, and that canvas is wider than the layout viewport and counts toward the document's size: a mobile browser zooms out to fit
         it, which makes innerWidth the wider size, and the canvas never shrinks. The stage, fixed and clipping, keeps the
         canvas out of the document's size, and `minimum-scale=1` above stops the browser zooming out. */
      #stage { position: fixed; inset: 0; overflow: hidden; }
      #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #status { position: fixed; inset: 0; display: grid; place-content: center; padding: 32px; color: #334155; background: #f8fafc; font: 16px/1.5 system-ui, sans-serif; white-space: pre-wrap; }
      #status[hidden] { display: none; }
    </style>
    $GODOT_HEAD_INCLUDE
  </head>
  <body>
    <div id="stage">
      <canvas id="canvas" tabindex="0" aria-label="Godot React UI demonstration"></canvas>
    </div>
    <div id="status" role="status">Loading the native UI playground…</div>
    <script src="$GODOT_URL"></script>
    <script>
      const config = $GODOT_CONFIG;
      const engine = new Engine(config);
      const canvas = document.getElementById('canvas');
      const status = document.getElementById('status');
      // Normalize Shift+scroll when the browser or device leaves the delta on deltaY (for example macOS trackpads or when
      // the canvas did not hold DOM focus when Shift was pressed, so DisplayServerWeb's Input::is_key_pressed(Key::SHIFT)
      // is false and _mouse_wheel_callback would otherwise check p_delta_y before p_delta_x).
      canvas.addEventListener('wheel', event => {
        if (event.shiftKey && event.deltaY !== 0) {
          event.stopImmediatePropagation();
          event.preventDefault();
          canvas.dispatchEvent(new WheelEvent('wheel', {
            bubbles: true,
            cancelable: true,
            clientX: event.clientX,
            clientY: event.clientY,
            screenX: event.screenX,
            screenY: event.screenY,
            deltaMode: event.deltaMode,
            deltaX: Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY,
            deltaY: 0,
            deltaZ: event.deltaZ,
            ctrlKey: event.ctrlKey,
            shiftKey: event.shiftKey,
            altKey: event.altKey,
            metaKey: event.metaKey,
            buttons: event.buttons,
          }));
        }
      }, true);
      // Keep Ctrl+C / Cmd+C and the browser's copy command working for selectable text even when the canvas lost DOM focus
      // or the browser requires clipboard writes inside the synchronous DOM keydown/copy gesture.
      window.addEventListener('keydown', event => {
        if (document.activeElement === document.body || document.activeElement === document.documentElement) {
          canvas.focus();
        }
        if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.shiftKey && event.key.toLowerCase() === 'c') {
          const selected = window.__godotReactSelectedText;
          if (typeof selected === 'string' && selected.length > 0) {
            navigator.clipboard?.writeText?.(selected)?.catch(() => {});
          }
        }
      }, true);
      window.addEventListener('copy', event => {
        const selected = window.__godotReactSelectedText;
        if (typeof selected === 'string' && selected.length > 0 && event.clipboardData) {
          event.clipboardData.setData('text/plain', selected);
          event.preventDefault();
        }
      });
      const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
      const args = ['--audio-driver', 'Dummy'];
      const params = new URLSearchParams(location.search);
      // The lab the address names, or null: `?lab=glass`, or in the hash `#lab=glass`, `#/labs/glass` or `#glass`. A hash of other
      // parameters (`#foo=bar`) names none.
      function labOfAddress() {
        const fromQuery = new URLSearchParams(location.search).get('lab');
        if (fromQuery) return fromQuery;
        const hash = location.hash.replace(/^#\/?/, '');
        if (hash.includes('=')) return new URLSearchParams(hash).get('lab') || null;
        if (hash.startsWith('labs/')) return hash.slice('labs/'.length) || null;
        return hash !== '' && !hash.includes('/') && !hash.includes('?') ? hash : null;
      }
      const requestedLab = labOfAddress();
      // The project page the address names (`?page=install`), or null; the navigator's bare address is its home page.
      function pageOfAddress() {
        return new URLSearchParams(location.search).get('page') || null;
      }
      const requestedPage = requestedLab === null ? pageOfAddress() : null;
      // Arguments for the demo's scripts follow `--`. `?scene=res://world.tscn` starts that scene instead of
      // the project's main scene through the SceneLauncher autoload: Breaka's Web engine has no
      // command-line path overrides, so the scene cannot be given to the engine itself (docs/WORLD_SPACE.md).
      // `?lab=glass` opens the lab navigator on that lab, `?page=install` on that project page, `?demo=navigator` on its home page and `?demo=app` opens the
      // single-page playground. This page, bare, opens the playground, which is what the Web verifiers load; `pnpm demo:web`
      // sends the bare address to the navigator (demo/src/launch.ts).
      const userArgs = [];
      if (params.get('verify') === '1') userArgs.push('--verify');
      if (params.get('scene') !== null) userArgs.push('--scene', params.get('scene'));
      if (requestedLab !== null) userArgs.push(`--lab=${requestedLab}`);
      if (requestedPage !== null) userArgs.push(`--page=${requestedPage}`);
      if (params.get('demo') !== null) userArgs.push(`--demo=${params.get('demo')}`);
      else if (requestedLab === null && requestedPage === null) userArgs.push('--demo=app');
      if (userArgs.length > 0) args.push('--', ...userArgs);

      // Back, forward and an edited hash open the lab or the project page the address names in the running page (before the demo has
      // started, the address it starts from is the one above). The navigator's address with neither is its home page.
      function syncFromBrowserUrl(event) {
        const demo = window.godotReactDemo;
        const lab = labOfAddress() ?? event?.state?.lab;
        if (lab) {
          if (typeof demo?.navigateLab === 'function') demo.navigateLab(lab);
          return;
        }
        const page = pageOfAddress() ?? event?.state?.page
          ?? (new URLSearchParams(location.search).get('demo') === 'navigator' ? 'home' : null);
        if (page && typeof demo?.navigatePage === 'function') demo.navigatePage(page);
      }
      window.addEventListener('popstate', syncFromBrowserUrl);
      window.addEventListener('hashchange', syncFromBrowserUrl);

      // `?hz=120` (opt-in) draws the engine on an OffscreenCanvas at that rate. iOS Safari holds the page's rendering updates, and so
      // requestAnimationFrame, near 60 Hz even on a 120 Hz panel, but it shows an OffscreenCanvas's frame when the frame is committed, not
      // at the page's next rendering update. `&boost=1` also keeps the panel at its full rate, and `&fps=1` shows the rates. docs/WEB.md,
      // "High refresh rate", says what this needs and costs.
      const PAGE_UPDATE_HZ = 60;
      // How often the `fps` readout is refreshed, and how often the boost scroller is sent the other way.
      const READOUT_INTERVAL_MS = 1000;
      const BOOST_KICK_INTERVAL_MS = 400;

      function offscreenWebGl2Available() {
        if (typeof HTMLCanvasElement.prototype.transferControlToOffscreen !== 'function' || typeof OffscreenCanvas !== 'function') return false;
        const probe = new OffscreenCanvas(1, 1).getContext('webgl2');
        if (probe === null) return false;
        probe.getExtension('WEBGL_lose_context')?.loseContext();
        return true;
      }

      // Moves `canvas` to an OffscreenCanvas the first time the engine asks it for a WebGL context, and replaces requestAnimationFrame
      // with a clock at `hz` locked to the display. Must run before the engine starts: callbacks asked for before it are not this clock's.
      function startHighRefresh(canvas, hz) {
        const state = { hz, offscreen: null, frames: 0, pageUpdates: 0 };

        // The element stays in the page as the OffscreenCanvas's placeholder: it keeps the events, focus and CSS size, and its `width` and
        // `height`, which the engine sets from the window, are forwarded to the OffscreenCanvas, which sizes the drawing buffer.
        const elementPrototype = HTMLCanvasElement.prototype;
        const nativeGetContext = elementPrototype.getContext;
        const forwardContextEvent = (event) => {
          // The engine and Emscripten listen for context loss on the element; the OffscreenCanvas is what loses the context.
          const copy = new WebGLContextEvent(event.type, { cancelable: event.cancelable, statusMessage: event.statusMessage });
          if (!canvas.dispatchEvent(copy)) event.preventDefault();
        };
        canvas.getContext = function (type, attributes) {
          if (type !== 'webgl2' && type !== 'webgl') return nativeGetContext.call(this, type, attributes);
          if (state.offscreen === null) {
            state.offscreen = canvas.transferControlToOffscreen();
            state.offscreen.addEventListener('webglcontextlost', forwardContextEvent);
            state.offscreen.addEventListener('webglcontextrestored', forwardContextEvent);
          }
          return state.offscreen.getContext(type, attributes);
        };
        for (const name of ['width', 'height']) {
          const native = Object.getOwnPropertyDescriptor(elementPrototype, name);
          Object.defineProperty(canvas, name, {
            configurable: true,
            get() { return state.offscreen === null ? native.get.call(canvas) : state.offscreen[name]; },
            set(value) { if (state.offscreen === null) native.set.call(canvas, value); else state.offscreen[name] = value; },
          });
        }

        // The clock: frames fall on slots `1000 / hz` ms apart, in phase with the latest real animation frame (a display refresh). A frame
        // asked for runs at the first slot after the one before it, so a frame that takes longer than a slot leaves the next slot empty
        // and frames stay evenly spaced. A hidden page gets no frames until it is shown, as with requestAnimationFrame.
        const nativeRequest = window.requestAnimationFrame.bind(window);
        const interval = 1000 / hz;
        let vsync = performance.now();
        let lastSlot = -Infinity;
        let pending = new Map();
        let nextId = 1;
        let armed = false;
        const onPageUpdate = (stamp) => {
          vsync = stamp;
          state.pageUpdates += 1;
          nativeRequest(onPageUpdate);
        };
        nativeRequest(onPageUpdate);
        const runFrame = (slot) => {
          armed = false;
          lastSlot = slot;
          state.frames += 1;
          const callbacks = pending;
          pending = new Map();
          for (const callback of callbacks.values()) {
            try {
              callback(slot);
            } catch (error) {
              reportError(error);
            }
          }
        };
        // Timers set from inside timers are clamped to at least 4 ms once nested five deep, which would push frames off their slots;
        // a timer set from a message event starts a new chain.
        const hop = new MessageChannel();
        hop.port1.onmessage = () => {
          const now = performance.now();
          let slot = vsync + Math.ceil((now - vsync) / interval) * interval;
          if (slot - lastSlot < interval / 2) slot += interval;
          setTimeout(() => runFrame(slot), Math.max(0, slot - now));
        };
        window.requestAnimationFrame = (callback) => {
          const id = nextId++;
          pending.set(id, callback);
          if (!armed) {
            armed = true;
            if (document.visibilityState === 'hidden') nativeRequest(runFrame);
            else hop.port2.postMessage(null);
          }
          return id;
        };
        window.cancelAnimationFrame = (id) => { pending.delete(id); };
        return state;
      }

      // ProMotion lowers the panel's rate when nothing on the page animates; a scroll animation in flight keeps it at full rate. A tiny
      // invisible scroller is sent smoothly from end to end, back and forth, while the page is shown.
      function keepPanelAtFullRate() {
        const scroller = document.createElement('div');
        scroller.setAttribute('aria-hidden', 'true');
        scroller.style.cssText = 'position: fixed; left: 0; top: 0; width: 4px; height: 4px; overflow: scroll; opacity: 0.01; pointer-events: none;';
        const track = document.createElement('div');
        track.style.cssText = 'width: 1px; height: 100000px;';
        scroller.appendChild(track);
        document.body.appendChild(scroller);
        let toEnd = true;
        setInterval(() => {
          if (document.visibilityState === 'hidden') return;
          scroller.scrollTo({ top: toEnd ? track.offsetHeight : 0, behavior: 'smooth' });
          toEnd = !toEnd;
        }, BOOST_KICK_INTERVAL_MS);
      }

      function showRates(state) {
        const readout = document.createElement('div');
        readout.style.cssText = 'position: fixed; left: 4px; bottom: 4px; padding: 2px 6px; border-radius: 4px; background: #000a; color: #4ade80; font: 11px ui-monospace, monospace; pointer-events: none;';
        document.body.appendChild(readout);
        let frames = 0;
        let pageUpdates = 0;
        setInterval(() => {
          readout.textContent = `engine ${state.frames - frames}/s · page ${state.pageUpdates - pageUpdates}/s · ${state.offscreen === null ? 'canvas' : 'offscreen'}`;
          frames = state.frames;
          pageUpdates = state.pageUpdates;
        }, READOUT_INTERVAL_MS);
      }

      if (missing.length) {
        status.textContent = `This browser is missing required features:\n${missing.join('\n')}`;
      } else {
        if (params.has('hz')) {
          const hz = Number(params.get('hz'));
          if (!(hz > PAGE_UPDATE_HZ)) {
            console.warn(`GODOT_REACT_HIGH_REFRESH_IGNORED: hz=${params.get('hz')} is not above the page rate (${PAGE_UPDATE_HZ})`);
          } else if (!offscreenWebGl2Available()) {
            console.warn('GODOT_REACT_HIGH_REFRESH_UNAVAILABLE: this browser cannot draw WebGL 2 on an OffscreenCanvas; running at the page rate');
          } else {
            window.godotReactHighRefresh = startHighRefresh(canvas, hz);
            if (params.get('boost') === '1') keepPanelAtFullRate();
            if (params.get('fps') === '1') showRates(window.godotReactHighRefresh);
          }
        }
        engine.startGame({
          args,
          // The loader counts the bytes it receives after the browser has decoded them (a compressed transfer arrives as the file's own
          // bytes) against the sizes the export wrote in `fileSizes`, which are the files' own sizes: the percentage is right whatever the
          // transfer encoding. It follows only the pack and the engine module; the side modules load beside them through Emscripten and
          // are not counted, so the percentage can reach 100% while they are still arriving: the page then says what is happening instead
          // of sitting on a number.
          onProgress(current, total) {
            if (total <= 0) return;
            status.textContent = current >= total
              ? 'Starting the native UI playground…'
              : `Loading the native UI playground… ${Math.round(current / total * 100)}%`;
          },
        }).then(() => { status.hidden = true; }).catch(error => {
          console.error('GODOT_REACT_START_FAILED', error);
          status.textContent = `Unable to start the demo.\n${String(error)}`;
        });
      }
    </script>
  </body>
</html>
