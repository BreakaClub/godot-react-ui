[package]
name = "godot-react-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Taffy layout and canvas rendering for React in GodotJS"

[lib]
crate-type = ["cdylib", "rlib"]
path = "native/lib.rs"

[features]
web = ["godot/experimental-wasm"]
# Phase F0 evidence probe (native/probe.rs). Never enabled in a default build.
probe = []
# Negative controls for the filters verifier (native/filter_faults.rs). Never enabled in a default build.
filter-faults = []

[dependencies]
# Lean Web templates omit optional 3D physics classes. Resolve only methods this
# main-thread UI extension uses; gdext still validates each class/method/hash on
# first use (godot 0.5.5 lazy-function-tables). No experimental-threads support.
godot = { version = "=0.5.5", features = ["api-custom-json", "lazy-function-tables"] }
# Match Blitz's Taffy revision so the CSS and layout bridges share one typed API.
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "fca167cf659b8bf48019d0dea90624109a78103f", default-features = false, features = ["std", "taffy_tree", "flexbox", "flexbox_balance", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"] }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "3f85506dcf2e465947413cef87d15515d0c548c8", default-features = false }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "3f85506dcf2e465947413cef87d15515d0c548c8", default-features = false }
style = { package = "stylo", git = "https://github.com/servo/stylo", rev = "2dca34592ced37c6aa01733e94206a767194cf9d" }
# `backdrop-filter` is behind a static pref that is off by default (preferences.toml); the style engine turns it on.
stylo_static_prefs = { git = "https://github.com/servo/stylo", rev = "2dca34592ced37c6aa01733e94206a767194cf9d" }
# The 3D transform types Stylo's computed transform functions take and return (the revision above uses 0.22).
euclid = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
