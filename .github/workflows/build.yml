name: Build binaries

# The extension for every platform the package ships (scripts/native-binding.mjs's BINARY_TARGETS, and the two Web side modules), each as a
# `native-*` artifact of one file. CI and Release both call this, so what a release publishes is built and checked the way every commit is.
#
# The desktop libraries are built on their own system and architecture and then loaded in the official Godot editor, with no GodotJS, where
# a root lays out a commit (scripts/verify-load.mjs). The Android and iOS libraries are built and linked with nothing left undefined, and
# each Web side module is checked to import the memory its export has (shared with threads, unshared without); nothing here can run those.
on:
  workflow_call:
    inputs:
      retention-days:
        description: Days the artifacts are kept
        type: number
        default: 14

env:
  # The stock editor the desktop libraries are loaded in: the release whose API they are bound to (scripts/native-binding.mjs's
  # NATIVE_BINDING_API).
  GODOT_RELEASE: https://github.com/godotengine/godot/releases/download/4.7.2-stable

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos.universal
            runner: macos-latest
            triples: aarch64-apple-darwin x86_64-apple-darwin
            library: libgodot_react_ui.dylib
            godot-archive: Godot_v4.7.2-stable_macos.universal.zip
            godot-binary: Godot.app/Contents/MacOS/Godot
          # The oldest Ubuntu GitHub runs: the library needs the glibc of the system it is linked on, or a newer one (2.35).
          - target: linux.x86_64
            runner: ubuntu-22.04
            triples: x86_64-unknown-linux-gnu
            library: libgodot_react_ui.linux.x86_64.so
            godot-archive: Godot_v4.7.2-stable_linux.x86_64.zip
            godot-binary: Godot_v4.7.2-stable_linux.x86_64
          - target: linux.arm64
            runner: ubuntu-22.04-arm
            triples: aarch64-unknown-linux-gnu
            library: libgodot_react_ui.linux.arm64.so
            godot-archive: Godot_v4.7.2-stable_linux.arm64.zip
            godot-binary: Godot_v4.7.2-stable_linux.arm64
          - target: windows.x86_64
            runner: windows-latest
            triples: x86_64-pc-windows-msvc
            library: godot_react_ui.windows.x86_64.dll
            godot-archive: Godot_v4.7.2-stable_win64.exe.zip
            godot-binary: Godot_v4.7.2-stable_win64_console.exe
          - target: windows.arm64
            runner: windows-11-arm
            triples: aarch64-pc-windows-msvc
            library: godot_react_ui.windows.arm64.dll
            godot-archive: Godot_v4.7.2-stable_windows_arm64.exe.zip
            godot-binary: Godot_v4.7.2-stable_windows_arm64_console.exe
          - target: android.arm64
            runner: ubuntu-latest
            triples: aarch64-linux-android
            library: libgodot_react_ui.android.arm64.so
          - target: android.x86_64
            runner: ubuntu-latest
            triples: x86_64-linux-android
            library: libgodot_react_ui.android.x86_64.so
          - target: ios.arm64
            runner: macos-latest
            triples: aarch64-apple-ios
            library: libgodot_react_ui.ios.arm64.dylib
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (rust-toolchain.toml) with the build's targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.triples }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build
        run: node scripts/build-binary.mjs --target=${{ matrix.target }}

      - name: Fetch the stock Godot editor
        if: matrix.godot-archive
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/godot.zip" "$GODOT_RELEASE/${{ matrix.godot-archive }}"
          if [ "$RUNNER_OS" = Windows ]; then 7z x -y -o"$RUNNER_TEMP/godot" "$RUNNER_TEMP/godot.zip"; else unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"; fi
          echo "GODOT=$RUNNER_TEMP/godot/${{ matrix.godot-binary }}" >> "$GITHUB_ENV"

      - name: Load the library in stock Godot and lay out a commit with it
        if: matrix.godot-archive
        run: node scripts/verify-load.mjs

      # The universal library's other half: the same editor run as x86_64, under Rosetta.
      - name: Load the x86_64 half in stock Godot
        if: matrix.target == 'macos.universal'
        run: node scripts/verify-load.mjs --arch=x86_64

      # One file per artifact: a file is stored at the artifact's root, which the packing job downloads into the addon's bin directory.
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: out/bin/${{ matrix.library }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # The package's side modules are the stock profile's: upstream GodotJS on stock Godot 4.7, whose Web templates are built with Emscripten
  # 4.0.11 and have no lazy function table (Breaka's engine needs a module of its own, built with its own SDK, and is not this package's).
  # One for each threading of a Web export: a module imports the engine's memory, shared or not, so neither loads in the other's export.
  web:
    name: web.${{ matrix.threading }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - threading: threads
            library: godot_react_ui.web.wasm
          - threading: nothreads
            library: godot_react_ui.web.nothreads.wasm
            flag: --nothreads
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup Emscripten 4.0.11 (the stock profile's SDK)
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.11

      # The nightly scripts/engine.mjs pins for the Web build (`web.nightly`): -Zbuild-std rebuilds the standard library for the module's
      # threading, which needs rust-src, and a later nightly lacks the JS exception-handling switch gdext 0.5.5's Web ABI needs.
      - name: Setup Rust (nightly-2026-05-15, as scripts/engine.mjs pins it)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-15
          components: rust-src
          targets: wasm32-unknown-emscripten

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # The repository's own recipe (scripts/build-web.mjs): the side-module, threading and visibility flags, -Zbuild-std, the stock
      # profile's API dumps, its build stamp and the check of the memory the module imports. Not a cargo command written out here, so the
      # two cannot drift.
      - name: Build the Web side module
        run: |
          test -n "${EMSDK:-}" || { echo "setup-emsdk did not set EMSDK: the build needs the SDK's root"; exit 1; }
          EMSDK_ROOT="$EMSDK" CARGO="$(command -v cargo)" node scripts/build-web.mjs --engine=stock --wasm-only ${{ matrix.flag }}

      - uses: actions/upload-artifact@v7
        with:
          name: native-web.${{ matrix.threading }}
          path: demo/addons/godot-react-ui/bin/${{ matrix.library }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
