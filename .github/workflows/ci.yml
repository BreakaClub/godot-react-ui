name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Get pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm test:types

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # The extension for every platform the package ships, built on every commit the way a release builds it (build.yml).
  binaries:
    name: Binaries
    uses: ./.github/workflows/build.yml

  # What a release would publish, from this commit: the npm tarball and the addon as a zip, kept as the run's `godot-react-ui-package`
  # artifact. The staging refuses to pack unless every library the extension's manifest names was built.
  package:
    name: Package (npm tarball and addon zip)
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm build

      # Each artifact is one library, stored at its root: together they are the addon's bin directory.
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: demo/addons/godot-react-ui/bin/
          merge-multiple: true

      - name: Stage, zip and pack
        run: |
          mkdir -p package
          node scripts/stage-addon.mjs --require-all-platforms
          (cd addon && zip -r ../package/godot-react-ui-addon.zip godot-react-ui/)
          pnpm pack --pack-destination package
          ls -lah package

      - uses: actions/upload-artifact@v7
        with:
          name: godot-react-ui-package
          path: package/
          if-no-files-found: error
          retention-days: 14
