name: Auto Release (godot-react-ui)

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

jobs:
  detect-changes:
    if: ${{ (github.event_name == 'workflow_dispatch') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.detect.outputs.release_needed }}
      target_sha: ${{ steps.detect.outputs.target_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect godot-react-ui release-scope changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          target_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "Workflow dispatched manually; proceeding with release."
            exit 0
          fi

          last_tag="$(git tag --list 'godot-react-ui@*' --sort=-v:refname | head -n1)"
          if [[ -n "$last_tag" ]]; then
            changed_files="$(git diff --name-only "${last_tag}..${target_sha}")"
          else
            changed_files="$(git ls-files)"
          fi

          root_changes="$(printf '%s\n' "$changed_files" | grep -E -v '^$|^\\.github/|^scripts/|^\\.gitignore$|^\\.editorconfig$|^README(\\.md)?$' || true)"
          if [[ -n "$root_changes" ]]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "Detected godot-react-ui release-scope changes."
          else
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "No godot-react-ui release-scope changes since last scoped tag."
          fi

  build-native:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.release_needed == 'true' }}
    name: Build Native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            artifact: libgodot_react_ui.dylib
          - platform: linux
            os: ubuntu-22.04
            artifact: libgodot_react_ui.so
          - platform: windows
            os: windows-latest
            artifact: godot_react_ui.dll

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.detect-changes.outputs.target_sha }}

      - name: Setup Rust (pinned 1.99.1)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build macOS (Universal arm64 + x86_64)
        if: matrix.platform == 'macos'
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir -p bin
          lipo -create \
            target/aarch64-apple-darwin/release/libgodot_react_ui.dylib \
            target/x86_64-apple-darwin/release/libgodot_react_ui.dylib \
            -output bin/libgodot_react_ui.dylib

      - name: Build Linux (x86_64)
        if: matrix.platform == 'linux'
        run: |
          cargo build --locked --release
          mkdir -p bin
          cp target/release/libgodot_react_ui.so bin/

      - name: Build Windows (x86_64)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo build --locked --release
          New-Item -ItemType Directory -Force -Path bin
          Copy-Item target/release/godot_react_ui.dll bin/

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: bin/${{ matrix.artifact }}
          if-no-files-found: error

  build-web:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.release_needed == 'true' }}
    name: Build Web (WASM)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.detect-changes.outputs.target_sha }}

      - name: Setup Emscripten (stock 4.0.11 convention)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.11

      - name: Setup Rust Web Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-emscripten

      - name: Build Web Side Module
        run: |
          cargo build --locked --release --target wasm32-unknown-emscripten --features web
          mkdir -p bin
          cp target/wasm32-unknown-emscripten/release/godot_react_ui.wasm bin/godot_react_ui.web.wasm

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-web
          path: bin/godot_react_ui.web.wasm
          if-no-files-found: error

  release:
    needs: [detect-changes, build-native, build-web]
    if: ${{ needs.detect-changes.outputs.release_needed == 'true' }}
    name: Auto Release & NPM Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.detect-changes.outputs.target_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.5.2
          run_install: false

      - name: Get pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Plan Release
        id: release_plan
        run: node scripts/run-auto-release.mts --plan-only --tag-prefix "godot-react-ui@" --target-sha "${{ needs.detect-changes.outputs.target_sha }}" --github-output "${GITHUB_OUTPUT}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set package version for release
        if: ${{ steps.release_plan.outputs.release_created == 'true' }}
        run: npm pkg set version="${{ steps.release_plan.outputs.release_version }}"

      - name: Build TypeScript Reconciler & Kit
        if: ${{ steps.release_plan.outputs.release_created == 'true' }}
        run: pnpm build

      - name: Download Pre-built Native Binaries
        if: ${{ steps.release_plan.outputs.release_created == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: addon-binaries/
          merge-multiple: true

      - name: Stage Addon Directory
        if: ${{ steps.release_plan.outputs.release_created == 'true' }}
        run: |
          mkdir -p demo/addons/godot-react-ui/bin
          cp -f addon-binaries/* demo/addons/godot-react-ui/bin/
          node scripts/stage-addon.mjs
          
          # Create standalone zip for GitHub Release asset
          mkdir -p release/godot-react-ui
          (cd addon && zip -r ../release/godot-react-ui/godot-react-ui-addon.zip godot-react-ui/)

      - name: Package Release Assets (pnpm pack)
        if: ${{ steps.release_plan.outputs.release_created == 'true' }}
        run: |
          mkdir -p release/godot-react-ui
          rm -f release/godot-react-ui/*.tgz
          pnpm pack --pack-destination release/godot-react-ui
          ls -lah release/godot-react-ui

      - name: Auto Release (Create Tag & GitHub Release)
        id: auto_release
        if: ${{ steps.release_plan.outputs.release_created == 'true' }}
        run: node scripts/run-auto-release.mts --tag-prefix "godot-react-ui@" --target-sha "${{ needs.detect-changes.outputs.target_sha }}" --expected-version "${{ steps.release_plan.outputs.release_version }}" --github-output "${GITHUB_OUTPUT}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (Skipped - pending NPM credentials)
        if: ${{ steps.auto_release.outputs.release_created == 'true' }}
        run: |
          package_tgz="release/godot-react-ui/godot-react-ui-${{ steps.auto_release.outputs.release_version }}.tgz"
          test -f "$package_tgz"
          echo "Verified package tarball exists at: $package_tgz"
          echo "NPM publishing is intentionally skipped at this stage pending credentials / OIDC configuration."
