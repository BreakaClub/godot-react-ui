name: Release

# A tag `v<version>` (matching package.json) builds the binaries, stages the addon, packs the npm tarball, attaches both to a GitHub release
# and publishes that tarball to npm (the `publish` job: trusted publishing, in the `npm` environment).
#
# Run by hand (Actions > Release > Run workflow, or `gh workflow run release.yml --ref <branch>`), it is a dry run: it makes everything a
# release would publish and stops there. The tarball and the addon zip are the run's `godot-react-ui-release` artifact (`pnpm pack` lists
# the tarball's files), and `pnpm publish --dry-run` takes that tarball as far as publishing it. Only a pushed tag publishes, whatever ref
# a run by hand names.
#
# Platforms: every one build.yml builds (a universal macOS library; Linux, Windows and Android for x86_64 and arm64; iOS arm64; and the Web
# side modules for stock Godot 4.7 templates with and without threads). The release job refuses to pack unless all of them are there.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# What the run is, in the list of runs: a release of a tag, or a dry run of the ref it was run on.
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('Release dry run ({0})', github.ref_name) }}

jobs:
  # Every platform's library and the Web side module (build.yml). Handed to the release job in the same run; the release keeps what it
  # publishes.
  binaries:
    name: Binaries
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 1

  release:
    needs: binaries
    name: "${{ github.event_name == 'push' && 'Pack & GitHub release' || 'Pack (dry run, nothing published)' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: The tag names package.json's version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Build TypeScript
        run: pnpm build

      # Each artifact is one library, stored at its root: together they are the addon's bin directory.
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: demo/addons/godot-react-ui/bin/
          merge-multiple: true

      - name: Stage the addon
        run: |
          mkdir -p release
          node scripts/stage-addon.mjs --require-all-platforms
          (cd addon && zip -r ../release/godot-react-ui-addon.zip godot-react-ui/)

      - name: Pack
        run: pnpm pack --pack-destination release && ls -lah release

      # The tarball as far as publishing it, published or not. It needs no npm credentials.
      - name: pnpm publish --dry-run
        run: pnpm publish --dry-run --no-git-checks release/godot-react-ui-*.tgz

      # What a release publishes, for a dry run to download and try.
      - uses: actions/upload-artifact@v7
        with:
          name: godot-react-ui-release
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --title "${GITHUB_REF_NAME}" --notes "godot-react-ui ${GITHUB_REF_NAME}"

  # A tag's release goes to npm with the very tarball the GitHub release has. Trusted publishing: npm takes GitHub's identity token for this
  # workflow and environment (configured on the package at npmjs.com), so no npm token is stored anywhere. A run by hand never gets here.
  publish:
    name: Publish to npm
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # pnpm 11 exchanges the identity token for a publish token itself (package.json's packageManager names the version).
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - uses: actions/download-artifact@v8
        with:
          name: godot-react-ui-release
          path: release/

      - name: pnpm publish
        run: pnpm publish --no-git-checks release/godot-react-ui-*.tgz
